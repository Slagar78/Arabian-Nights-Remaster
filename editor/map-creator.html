<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Arabian Nights - Map to Binary Converter</title>
    <style>
        :root {
            --bg: #121212; --panel: #1e1e1e; --border: #333;
            --text: #ddd; --accent: #4CAF50;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .header {
            background: var(--panel); border: 1px solid var(--border);
            padding: 15px; border-radius: 8px;
            display: flex; gap: 15px; align-items: center;
        }
        .btn {
            background: #333; color: #fff; border: 1px solid #555;
            padding: 10px 15px; border-radius: 5px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        .btn:hover { background: #444; }
        .btn.primary { background: var(--accent); border-color: var(--accent); }
        
        .workspace { display: flex; gap: 20px; }
        .panel {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; padding: 15px; flex: 1;
            overflow: auto; max-height: 80vh;
        }
        canvas { display: block; background: #000; border: 1px solid #555; }
        input[type="file"] { display: none; }
        .status { font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <label for="fileInput" class="btn">📁 Загрузить карту (PNG)</label>
        <input type="file" id="fileInput" accept="image/png, image/jpeg">
        <span class="status" id="status">Ждем картинку...</span>
        <button class="btn primary" onclick="processMap()">⚙️ Разбить на тайлы</button>
    </div>

    <div class="workspace">
        <div class="panel">
            <h3>Исходная карта (64x64 сетка)</h3>
            <canvas id="sourceCanvas"></canvas>
        </div>

        <div class="panel">
            <h3>Сгенерированный тайлсет</h3>
            <p style="font-size: 12px; color: #888;">Уникальных тайлов: <span id="tileCount">0</span></p>
            <button class="btn" onclick="downloadTileset()">Скачать tileset.png</button>
            <button class="btn primary" onclick="downloadBinaryMap()">💾 Скачать layout.bin (Бинарный)</button>
            <button class="btn" onclick="downloadTextMap()" style="font-size:12px; margin-top:10px;">Скачать map.txt (Для отладки)</button>
            <br><br>
            <canvas id="tilesetCanvas"></canvas>
        </div>
    </div>

    <script>
        const TILE_SIZE = 64;
        const MAX_TILESET_COLS = 8;

        let sourceImg = new Image();
        let isLoaded = false;
        let uniqueTiles = [];
        let tileMap = {};
        let mapGrid = [];

        const sourceCanvas = document.getElementById('sourceCanvas');
        const srcCtx = sourceCanvas.getContext('2d');
        const tilesetCanvas = document.getElementById('tilesetCanvas');
        const tsCtx = tilesetCanvas.getContext('2d');
        const statusEl = document.getElementById('status');

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImg.onload = () => {
                    isLoaded = true;
                    statusEl.innerText = `Карта загружена (${sourceImg.width}x${sourceImg.height})`;
                    sourceCanvas.width = sourceImg.width;
                    sourceCanvas.height = sourceImg.height;
                    srcCtx.drawImage(sourceImg, 0, 0);
                    drawGrid();
                };
                sourceImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function drawGrid() {
            srcCtx.strokeStyle = "rgba(255, 0, 0, 0.5)";
            srcCtx.lineWidth = 1;
            for (let x = 0; x < sourceCanvas.width; x += TILE_SIZE) {
                srcCtx.beginPath(); srcCtx.moveTo(x, 0); srcCtx.lineTo(x, sourceCanvas.height); srcCtx.stroke();
            }
            for (let y = 0; y < sourceCanvas.height; y += TILE_SIZE) {
                srcCtx.beginPath(); srcCtx.moveTo(0, y); srcCtx.lineTo(sourceCanvas.width, y); srcCtx.stroke();
            }
        }

        function processMap() {
            if (!isLoaded) return alert("Сначала загрузи карту!");

            const cols = Math.floor(sourceImg.width / TILE_SIZE);
            const rows = Math.floor(sourceImg.height / TILE_SIZE);
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = TILE_SIZE;
            tempCanvas.height = TILE_SIZE;
            const tempCtx = tempCanvas.getContext('2d');

            uniqueTiles = [];
            tileMap = {};
            mapGrid = Array(rows).fill().map(() => Array(cols).fill(0));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    tempCtx.clearRect(0, 0, TILE_SIZE, TILE_SIZE);
                    tempCtx.drawImage(sourceImg, c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE, 0, 0, TILE_SIZE, TILE_SIZE);
                    
                    const dataUrl = tempCanvas.toDataURL();

                    if (!tileMap[dataUrl]) {
                        tileMap[dataUrl] = uniqueTiles.length;
                        uniqueTiles.push(dataUrl);
                    }
                    
                    mapGrid[r][c] = tileMap[dataUrl] + 1;
                }
            }

            document.getElementById('tileCount').innerText = uniqueTiles.length;
            statusEl.innerText = "Готово! Можно скачивать.";
            
            renderTileset();
        }

        function renderTileset() {
            const tsCols = Math.min(uniqueTiles.length, MAX_TILESET_COLS);
            const tsRows = Math.ceil(uniqueTiles.length / MAX_TILESET_COLS);
            
            tilesetCanvas.width = tsCols * TILE_SIZE;
            tilesetCanvas.height = tsRows * TILE_SIZE;
            tsCtx.clearRect(0, 0, tilesetCanvas.width, tilesetCanvas.height);

            uniqueTiles.forEach((dataUrl, index) => {
                const img = new Image();
                img.onload = () => {
                    const x = (index % MAX_TILESET_COLS) * TILE_SIZE;
                    const y = Math.floor(index / MAX_TILESET_COLS) * TILE_SIZE;
                    tsCtx.drawImage(img, x, y);
                };
                img.src = dataUrl;
            });
        }

        function downloadTileset() {
            if (uniqueTiles.length === 0) return alert("Сначала нажми 'Разбить на тайлы'");
            const a = document.createElement('a');
            a.href = tilesetCanvas.toDataURL('image/png');
            a.download = 'tileset.png';
            a.click();
        }

        function downloadBinaryMap() {
            if (mapGrid.length === 0) return alert("Сначала нажми 'Разбить на тайлы'");
            
            const rows = mapGrid.length;
            const cols = mapGrid[0].length;
            
            const buffer = new ArrayBuffer(rows * cols * 2);
            const dataView = new DataView(buffer);

            let offset = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    dataView.setUint16(offset, mapGrid[r][c], true);
                    offset += 2;
                }
            }

            const blob = new Blob([buffer], { type: 'application/octet-stream' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'layout.bin';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function downloadTextMap() {
            if (mapGrid.length === 0) return alert("Сначала нажми 'Разбить на тайлы'");
            let text = "";
            for (let r = 0; r < mapGrid.length; r++) {
                text += mapGrid[r].join(" ") + "\n";
            }
            const blob = new Blob([text], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'map.txt';
            a.click();
        }
    </script>
</body>
</html>
